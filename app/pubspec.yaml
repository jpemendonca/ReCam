name: recam
description: "Turn spare Android phones into security cameras."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  app_links: ^7.2.1
  battery_plus: ^7.1.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.2+hotfix.3
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  signalr_netcore: ^1.4.4
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
