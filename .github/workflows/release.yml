name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The version code is the commit count, as in scripts/build-apk.sh.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      # The key only exists in the runner's temp folder, never in the workspace.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/recam-release.jks"

      - name: Build APKs
        working-directory: app
        env:
          RECAM_KEYSTORE_PATH: ${{ runner.temp }}/recam-release.jks
          RECAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RECAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RECAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$version" \
            --build-number="$(git rev-list --count HEAD)" \
            --dart-define=RECAM_VERSION="$version"

      - name: Rename APKs
        run: |
          out=app/build/app/outputs/flutter-apk
          mkdir dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "$out/app-$abi-release.apk" "dist/recam-$GITHUB_REF_NAME-$abi.apk"
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "ReCam $GITHUB_REF_NAME" --generate-notes

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/recam-release.jks"
