# Linux. Host networking lets both services see the machine's LAN addresses directly.
name: recam

services:
  server:
    build:
      context: ../server
      args:
        RECAM_VERSION: ${RECAM_VERSION:-dev}
    image: recam-server:local
    network_mode: host
    environment:
      RECAM_PUBLIC_URLS: ${RECAM_PUBLIC_URLS:-}
      RECAM_TLS: ${RECAM_TLS:-}
      RECAM_TRUSTED_PROXIES: ${RECAM_TRUSTED_PROXIES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RECAM_HOST: ${RECAM_HOST:-}
    volumes:
      - recam-data:/data
      - recam-recordings:/recordings
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    # Same user as the server, so the server can delete the segments MediaMTX writes.
    user: "1654:1654"
    # The server creates the recordings volume first, owned by that user.
    depends_on:
      - server
    network_mode: host
    environment:
      MTX_WEBRTCADDRESS: 127.0.0.1:8889
      # On a VPS whose public IP is not on a network interface, video needs it announced.
      MTX_WEBRTCADDITIONALHOSTS: ${RECAM_HOST:-}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recam-recordings:/recordings
    restart: unless-stopped

  motion:
    # Scores motion in closed recording segments; the server turns the scores into events.
    image: linuxserver/ffmpeg:9.0-cli-ls83
    user: "1654:1654"
    depends_on:
      - server
    network_mode: none
    entrypoint: ["/bin/bash", "/motion.sh"]
    volumes:
      - ./motion.sh:/motion.sh:ro
      - recam-recordings:/recordings
    restart: unless-stopped

  detect:
    # Looks for people in the seconds the motion service marked, on the CPU, with no network.
    build:
      context: ../server
      dockerfile: src/Recam.Detect/Dockerfile
    image: recam-detect:local
    depends_on:
      - server
    network_mode: none
    cpus: ${RECAM_DETECT_CPUS:-1}
    environment:
      RECAM_DETECT_THREADS: ${RECAM_DETECT_THREADS:-1}
    volumes:
      - recam-recordings:/recordings
    restart: unless-stopped

volumes:
  recam-data:
  recam-recordings:
