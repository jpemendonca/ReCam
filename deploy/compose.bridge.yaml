# Docker Desktop (Windows, macOS). There is no real host networking, so the containers
# cannot see the machine's LAN address: set RECAM_HOST in deploy/.env.
name: recam

services:
  server:
    build: ../server
    image: recam-server:local
    ports:
      - "8443:8443/tcp"
    environment:
      RECAM_PUBLIC_URLS: ${RECAM_PUBLIC_URLS:-}
      RECAM_TLS: ${RECAM_TLS:-}
      RECAM_TRUSTED_PROXIES: ${RECAM_TRUSTED_PROXIES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RECAM_HOST: ${RECAM_HOST:?Set RECAM_HOST in deploy/.env to this machine's LAN IP}
      RECAM_MEDIAMTX_URL: http://mediamtx:8889
    volumes:
      - recam-data:/data
      - recam-recordings:/recordings
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    # Same user as the server, so the server can delete the segments MediaMTX writes.
    user: "1654:1654"
    # The server creates the recordings volume first, owned by that user.
    depends_on:
      - server
    ports:
      - "8189:8189/udp"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${RECAM_HOST:?Set RECAM_HOST in deploy/.env to this machine's LAN IP}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recam-recordings:/recordings
    restart: unless-stopped

  motion:
    # Scores motion in closed recording segments; the server turns the scores into events.
    image: linuxserver/ffmpeg:9.0-cli-ls83
    user: "1654:1654"
    depends_on:
      - server
    network_mode: none
    entrypoint: ["/bin/bash", "/motion.sh"]
    volumes:
      - ./motion.sh:/motion.sh:ro
      - recam-recordings:/recordings
    restart: unless-stopped

volumes:
  recam-data:
  recam-recordings:
